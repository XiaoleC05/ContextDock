<text x="18.0" y="81.0" fill="#8b949e" xml:space="preserve"># 真实嵌入（bge-m3）：数字是真实检索质量，需要 API Key。</text>
<text x="18.0" y="101.0" fill="#c9d1d9" xml:space="preserve"></text>
