<text x="18.0" y="281.0" fill="#c9d1d9" xml:space="preserve">总计       51        0.461        0.647        0.667     0.477      0.511</text>
<text x="18.0" y="301.0" fill="#c9d1d9" xml:space="preserve">  说明：recall 按**期望条目**加权（多跳查询只命中一半记 0.5），MRR / NDCG 按查询平均。</text>
<text x="18.0" y="321.0" fill="#c9d1d9" xml:space="preserve"></text>
