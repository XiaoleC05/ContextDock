<text x="18.0" y="561.0" fill="#8b949e" xml:space="preserve"># 接上 Agent 之后，一次真实嵌入的检索（不是假嵌入）</text>
<text x="18.0" y="581.0" fill="#58a6ff" xml:space="preserve">&gt; search_knowledge_base { &#34;query&#34;: &#34;为什么不直接把两路分数加权求和&#34;, &#34;top_k&#34;: 3 }</text>
