<text x="18.0" y="721.0" fill="#c9d1d9" xml:space="preserve">     。 &gt; &gt; 两种方案都能用。选 RRF 的理由是**它不要求两个分数可比**， &gt; 而这意味着更少的调参和更稳定…</text>
