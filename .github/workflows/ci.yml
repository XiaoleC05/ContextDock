name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build / Vet / Format / Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          # 从 go.mod 读取版本，避免两处维护
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # gofmt -l 会列出格式不规范的文件；有输出就说明没格式化，直接失败
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt："
            echo "$unformatted"
            exit 1
          fi

      # GitHub 的 Ubuntu runner 自带 gcc，所以 -race 可用
      - name: Test (race detector + coverage)
        run: go test -race -cover -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # 检查有没有把密钥误提交进来
      - name: Check for leaked secrets
        run: |
          if git ls-files | grep -qE '(^|/)\.env$'; then
            echo "错误：.env 被提交进了仓库"
            exit 1
          fi
          echo "未发现 .env 泄漏"

      # 文档格式校验。配置在仓库根的 .markdownlint.json。
      # 命令和本地跑的一模一样，避免"本地过了 CI 挂"。
      - name: Lint markdown
        run: npx --yes markdownlint-cli2 "**/*.md"

  integration:
    name: Integration (PostgreSQL + pgvector)
    runs-on: ubuntu-latest

    # 起一个真实的 pgvector 数据库来跑集成测试。
    #
    # 本机 Docker 拉不动 Docker Hub 时这个 job 仍然能跑——
    # 所以它是"持久化代码是否真的能用"的唯一常态化保证。
    services:
      postgres:
        # ⚠️ 版本写死，且必须 >= 0.8.6（修复 CVE-2026-3172）
        image: pgvector/pgvector:0.8.6-pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contextdock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d contextdock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # service 容器和 job 在同一个网络里，所以直接用 localhost。
      # 建表脚本挂在 runner 上不会被 service 容器执行（那只认容器内的
      # docker-entrypoint-initdb.d），所以这里手动跑一遍。
      # 按文件名顺序应用**全部**迁移，不是只跑 001。
      #
      # ⚠️ 这里原来写死了 001_init.sql。后果不是"少跑一步"那么简单：
      # 集成测试会照常通过（它只用到 001 建的表），而**线上要跑的
      # 后续迁移从来没在 CI 里验证过**——002 的回填、003 的列与索引
      # 都是这样漏掉的。等真的在别人机器上执行时才发现写错了。
      #
      # ON_ERROR_STOP=1 也是必须的：不加的话 psql 遇到错误照样退出 0，
      # 迁移失败会被当成成功，后面所有步骤都建在坏掉的基础上。
      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in migrations/*.sql; do
            echo "→ $f"
            psql -v ON_ERROR_STOP=1 -h localhost -U postgres -d contextdock -f "$f"
          done

      - name: Run integration tests
        env:
          CONTEXTDOCK_TEST_DSN: "postgres://postgres:postgres@localhost:5432/contextdock?sslmode=disable"
        run: go test -v -tags=integration ./internal/store/

      # 端到端冒烟测试：把二进制当 MCP server 跑起来，用 stdio 发 JSON-RPC。
      # 单元测试覆盖不到的接缝（stdio 协议、stdout 是否被日志污染、
      # 工具 schema、降级链路、溯源字段是否过完序列化还在）只有这里能验证。
      - name: Build binary
        run: go build -o bin/contextdock ./cmd/contextdock

      - name: MCP end-to-end smoke test
        env:
          CONTEXTDOCK_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/contextdock?sslmode=disable"
          # 故意用假 Key，验证"嵌入失败时降级到关键词检索"这条真实故障路径
          SILICONFLOW_API_KEY: "sk-fake-key-for-ci"
        run: go run ./cmd/smoke bin/contextdock
